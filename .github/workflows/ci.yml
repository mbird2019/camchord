name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  quickstart:
    # What a new user does: a clean checkout, then the launcher, with nothing installed beforehand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg (a requirement the launcher only reports)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Launcher sets itself up
        run: ./camchord --version
      - name: Doctor
        run: ./camchord doctor
      - name: Launcher is quick the second time
        run: time ./camchord --version
      - name: Install and uninstall the menu entry
        env:
          XDG_BIN_HOME: ${{ runner.temp }}/bin
          XDG_DATA_HOME: ${{ runner.temp }}/share
        run: |
          ./camchord --install
          test -x "$XDG_BIN_HOME/camchord"
          grep -q "^Exec=$PWD/camchord" "$XDG_DATA_HOME/applications/camchord.desktop"
          ./camchord --uninstall
          test ! -e "$XDG_BIN_HOME/camchord"
