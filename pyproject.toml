[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camchord"
dynamic = ["version"]
description = "A desktop control window for USB cameras on Linux: live view, snapshots, recording, and pan/tilt/zoom from the keyboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Michael" }]
keywords = ["webcam", "camera", "ptz", "v4l2", "uvc", "obsbot", "linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Capture",
]
dependencies = ["PySide6>=6.5"]

[project.urls]
Homepage = "https://github.com/mbird2019/camchord"
Issues = "https://github.com/mbird2019/camchord/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
camchord = "camchord.__main__:main"

[tool.hatch.version]
path = "src/camchord/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/camchord"]

[tool.hatch.build.targets.wheel.shared-data]
"data/camchord.desktop" = "share/applications/camchord.desktop"
"data/camchord.svg" = "share/icons/hicolor/scalable/apps/camchord.svg"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long sentences shown to the user stay on one line
